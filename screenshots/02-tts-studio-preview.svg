        <text x="14" y="44" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#A1A1A6">Crisp &amp; dynamic</text>
        <text x="14" y="60" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#86868B">tech keynote</text>
        <text x="14" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#86868B">MALE</text>
