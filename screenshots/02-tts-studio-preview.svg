<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" fill="none">
  <defs>
    <radialGradient id="tts-bg" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#141720" />
      <stop offset="70%" stop-color="#0A0B0D" />
      <stop offset="100%" stop-color="#07080A" />
    </radialGradient>
    <pattern id="tts-dots" x="0" y="0" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#FFFFFF" fill-opacity="0.04" />
    </pattern>
  </defs>

  <rect width="1280" height="720" fill="url(#tts-bg)" />
  <rect width="1280" height="720" fill="url(#tts-dots)" />

  <!-- STUDIO SECTION HEADER -->
  <g transform="translate(80, 50)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11" fill="#0071E3" letter-spacing="1.5">[ S² NEURAL SYNTHESIZER ]</text>
    <text x="0" y="32" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="28" font-weight="600" fill="#FFFFFF" letter-spacing="-0.5">Text to Speech Studio</text>
    <text x="0" y="54" font-family="-apple-system, system-ui, sans-serif" font-size="13" fill="#86868B">Ultra-realistic 24kHz acoustic voice generation with natural micro-pauses and expressive nuances.</text>

    <!-- Script Preset Pills -->
    <g transform="translate(680, 10)">
      <rect x="0" y="0" width="165" height="30" rx="15" fill="#0071E3" />
      <text x="82" y="19" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#FFFFFF" text-anchor="middle">Conversational Story</text>

      <rect x="175" y="0" width="130" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="240" y="19" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#A1A1A6" text-anchor="middle">Deep Documentary</text>

      <rect x="315" y="0" width="115" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.05" stroke="#FFFFFF" stroke-opacity="0.1" stroke-width="1" />
      <text x="372" y="19" font-family="-apple-system, system-ui, sans-serif" font-size="11" fill="#A1A1A6" text-anchor="middle">Tech Podcast</text>
    </g>
  </g>

  <!-- LEFT COLUMN: SCRIPT COMPOSITION (WIDTH: 660px) -->
  <g transform="translate(80, 140)">
    <!-- Main Card -->
    <rect x="0" y="0" width="660" height="320" rx="16" fill="#151619" stroke="#FFFFFF" stroke-opacity="0.09" stroke-width="1" filter="drop-shadow(0 12px 30px rgba(0,0,0,0.5))" />
    
    <!-- Header inside Card -->
    <text x="24" y="32" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86868B" letter-spacing="1">SPEECH SCRIPT CONTENT</text>

    <!-- Enhance Nuance Button -->
    <g transform="translate(510, 16)">
      <rect x="0" y="0" width="126" height="26" rx="13" fill="#0071E3" fill-opacity="0.15" stroke="#0071E3" stroke-opacity="0.4" stroke-width="1" />
      <!-- Wand Icon -->
      <path d="M14 13 L22 5 M18 9 L20 11" stroke="#0071E3" stroke-width="1.5" stroke-linecap="round" />
      <text x="68" y="17" font-family="-apple-system, system-ui, sans-serif" font-size="11" font-weight="600" fill="#0071E3" text-anchor="middle">Enhance Nuance</text>
    </g>

    <!-- Textarea Box -->
    <rect x="24" y="54" width="612" height="190" rx="12" fill="#0F1012" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
    
    <text x="40" y="90" font-family="-apple-system, system-ui, sans-serif" font-size="14.5" fill="#FFFFFF" line-height="24">
      There was something unforgettable about that quiet dawn in the mountains.
    </text>
    <text x="40" y="118" font-family="-apple-system, system-ui, sans-serif" font-size="14.5" fill="#0071E3">
      &lt;breath&gt;
    </text>
    <text x="105" y="118" font-family="-apple-system, system-ui, sans-serif" font-size="14.5" fill="#FFFFFF">
      The fog lingered just above the pine trees, and for the first
    </text>
    <text x="40" y="146" font-family="-apple-system, system-ui, sans-serif" font-size="14.5" fill="#FFFFFF">
      time in months, everything slowed down. <tspan fill="#0071E3">|mhm|</tspan> It felt truly human.
    </text>

    <!-- Bottom Toolbar with Nuance Tags -->
    <g transform="translate(24, 260)">
      <line x1="0" y1="0" x2="612" y2="0" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1" />

      <text x="0" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#86868B">TAGS:</text>
      
      <!-- Tag Pills -->
      <rect x="42" y="10" width="62" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="73" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A1A1A6" text-anchor="middle">&lt;breath&gt;</text>

      <rect x="112" y="10" width="54" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="139" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A1A1A6" text-anchor="middle">&lt;sigh&gt;</text>

      <rect x="174" y="10" width="60" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="204" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A1A1A6" text-anchor="middle">&lt;laugh&gt;</text>

      <rect x="242" y="10" width="50" height="20" rx="4" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
      <text x="267" y="24" font-family="'JetBrains Mono', monospace" font-size="10" fill="#A1A1A6" text-anchor="middle">|mhm|</text>

      <!-- Metrics -->
      <text x="612" y="24" font-family="'JetBrains Mono', monospace" font-size="11" fill="#86868B" text-anchor="end">
        184 chars · 32 words · <tspan fill="#0071E3">~14s</tspan>
      </text>
    </g>

    <!-- VOICE PERSONAS COMPACT ROW (Below Script Card) -->
    <g transform="translate(0, 340)">
