        <text x="14" y="90" font-family="'JetBrains Mono', monospace" font-size="9" fill="#0071E3">FEMALE</text>
      </g>

      <!-- Charon -->
      <g transform="translate(148, 46)">
        <rect x="0" y="0" width="112" height="105" rx="10" fill="#151619" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Charon</text>
